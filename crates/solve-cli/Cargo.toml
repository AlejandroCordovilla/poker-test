[package]
name = "solve-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solve"
path = "src/main.rs"

[dependencies]
poker-core = { path = "../poker-core" }
preflop = { path = "../preflop" }
solver-api = { path = "../solver-api" }
solver-pfs = { path = "../solver-pfs" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
